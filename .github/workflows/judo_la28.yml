name: Simulazione LA28 Judo

# Parte a tuo comando (Actions -> Simulazione LA28 Judo -> Run workflow).
on:
  workflow_dispatch:
    inputs:
      solo_prova:
        description: "Solo prova: legge il ranking e mostra la simulazione nel log senza scrivere su Notion"
        type: boolean
        default: true
      modalita:
        description: "archivio = le simulazioni vecchie restano in Notion; sostituzione = vengono archiviate"
        type: choice
        options:
          - archivio
          - sostituzione
        default: sostituzione

jobs:
  judo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa il necessario
        run: pip install -r requirements.txt
      - name: Calcola la simulazione
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          DRY_RUN: ${{ inputs.solo_prova }}
          MODALITA: ${{ inputs.modalita }}
        run: python -u scrape_judo_la28.py
      - name: Conserva il file della pagina grafica
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judo-json
          path: judo.json
          if-no-files-found: ignore
      - name: Pubblica la pagina grafica
        if: ${{ inputs.solo_prova != true }}
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          if [ -z "$PAGES_TOKEN" ]; then
            echo "Il segreto PAGES_TOKEN non c'è: la pagina non viene aggiornata (judo.json è scaricabile da Artifacts)."
            exit 0
          fi
          git clone "https://x-access-token:${PAGES_TOKEN}@github.com/${{ github.repository_owner }}/map-q-la28.git" pagina
          cp judo.json pagina/judo.json
          cd pagina
          git config user.name "agente-judo"
          git config user.email "agente-judo@users.noreply.github.com"
          git add judo.json
          if git diff --cached --quiet; then
            echo "Nessuna novità da pubblicare."
          else
            git commit -m "Aggiorna la simulazione dei qualificati di judo"
            git push
            # il sito si ripubblica solo quando parte il suo flusso "Aggiorna mappa LA28": lo avvio io
            if GH_TOKEN="$PAGES_TOKEN" gh workflow run "Aggiorna mappa LA28" \
                 --repo "${{ github.repository_owner }}/map-q-la28"; then
              echo "Ho avviato la pubblicazione del sito: la pagina si aggiorna entro un paio di minuti."
            else
              echo "ATTENZIONE: judo.json è stato salvato ma non sono riuscito ad avviare la pubblicazione del sito."
              echo "Al token PAGES_TOKEN manca il permesso 'Actions: Read and write'. Intanto lancia a mano 'Aggiorna mappa LA28'."
            fi
          fi
